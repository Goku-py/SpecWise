name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job needs a fresh Postgres: the app builds its pg pool eagerly at
# import (src/lib/prisma.ts) and the catalog tests expect the seeded 56
# laptops. Test values below are fine for CI; production secrets never
# appear in this repo.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/specwise
  ADMIN_API_KEY: ci-admin-key-not-a-secret
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  PRICE_SYNC_APPLY: "false"

jobs:
  unit:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: specwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit & API tests
        run: npm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: specwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Seed catalog
        run: npx tsx prisma/seed.ts
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e suite
        run: npm run test:e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: specwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Seed catalog
        run: npx tsx prisma/seed.ts
      # next build needs real rows: generateStaticParams + ISR queries the DB
      - name: Build
        run: npm run build
